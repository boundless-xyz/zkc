[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Auto-detected contextual remappings put checkout paths into compiler metadata.
auto_detect_remappings = false
test = "test"
via_ir = true
optimizer = true
optimizer_runs = 200
build_info = true
build_info_path = "out/build-info"
extra_output = ["storageLayout"]
ffi = true
fs_permissions = [
  { access = "read", path = "out" },
  { access = "read-write", path = "deployment.toml" },
  { access = "read", path = "build-info-reference" }
]

# Profile for building reference contracts
[profile.reference]
out = "out-reference"
cache_path = "cache-reference"
build_info = true
build_info_path = "out-reference/build-info"
extra_output = ["storageLayout"]

# Profile for the ZKCFreeze deployment: no CBOR metadata / IPFS hash in the runtime code,
# so the deployed bytecode carries no fingerprint of the source or compiler metadata.
# Build, test and deploy ZKCFreeze only with FOUNDRY_PROFILE=freeze.
[profile.freeze]
out = "out-freeze"
cache_path = "cache-freeze"
build_info_path = "out-freeze/build-info"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "out-freeze" },
  { access = "read-write", path = "deployment.toml" },
  { access = "read", path = "build-info-reference" }
]

# Profile for deployment testing
[profile.deployment-test]
src = "src"
out = "out"
libs = ["lib"]
test = "test-deployment"
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [
  { access = "read", path = "out" },
  { access = "read", path = "deployment.toml" },
  { access = "read", path = "deployment_secrets.toml" }
]

# Invariant testing configuration
[invariant]
runs = 50                   # Faster execution while maintaining good coverage
depth = 50                  # Sufficient depth for complex state evolution
fail_on_revert = false      # Don't fail on individual reverts
call_override = false       # Use default call behavior
dictionary_weight = 80      # Weight for using dictionary values

[lint]
severity = ["Gas"]
exclude_lints = ["asm-keccak256", "incorrect-shift"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
